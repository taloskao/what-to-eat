<script>

/* ========================================
   基本設定
======================================== */

const SEARCH_RADIUS = 850;

const CACHE_TIME =
  6 * 60 * 60 * 1000;

const CACHE_KEY =
  "whatToEatRestaurantCacheV2";


/*
  公開 Overpass 節點

  如果第一個失敗，
  自動換下一個。
*/

const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://lz4.overpass-api.de/api/interpreter",

  "https://z.overpass-api.de/api/interpreter"

];


let userLat = null;
let userLon = null;

let restaurants = [];

let filteredRestaurants = [];

let currentRestaurant = null;

let recentIds = [];


/* ========================================
   價格資料
======================================== */

const priceRules = [

  {
    keywords:
      ["小吃","麵","noodle","dumpling",
       "水餃","餃子","滷肉","魯肉",
       "雞肉飯","rice"],
    min: 60,
    max: 180
  },

  {
    keywords:
      ["早餐","breakfast"],
    min: 60,
    max: 180
  },

  {
    keywords:
      ["麥當勞","mcdonald"],
    min: 100,
    max: 250
  },

  {
    keywords:
      ["肯德基","kfc"],
    min: 120,
    max: 300
  },

  {
    keywords:
      ["摩斯","mos burger"],
    min: 120,
    max: 300
  },

  {
    keywords:
      ["漢堡王","burger king"],
    min: 120,
    max: 300
  },

  {
    keywords:
      ["subway"],
    min: 120,
    max: 280
  },

  {
    keywords:
      ["牛肉麵"],
    min: 120,
    max: 280
  },

  {
    keywords:
      ["便當","自助餐"],
    min: 100,
    max: 220
  },

  {
    keywords:
      ["拉麵","ramen"],
    min: 180,
    max: 350
  },

  {
    keywords:
      ["咖哩","curry"],
    min: 150,
    max: 350
  },

  {
    keywords:
      ["義大利","pasta","italian"],
    min: 200,
    max: 450
  },

  {
    keywords:
      ["韓式","korean"],
    min: 200,
    max: 500
  },

  {
    keywords:
      ["火鍋","hotpot"],
    min: 250,
    max: 650
  },

  {
    keywords:
      ["牛排","steak"],
    min: 300,
    max: 1000
  },

  {
    keywords:
      ["燒肉","烤肉","bbq"],
    min: 400,
    max: 1000
  },

  {
    keywords:
      ["壽司","sushi","日本料理","japanese"],
    min: 180,
    max: 600
  }

];


/* ========================================
   取得定位
======================================== */

function getLocation() {

  return new Promise(
    (resolve, reject) => {

      if (!navigator.geolocation) {

        reject(
          new Error("這台裝置不支援定位")
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        position => {

          userLat =
            position.coords.latitude;

          userLon =
            position.coords.longitude;


          document
            .getElementById(
              "locationStatus"
            )
            .textContent =
              "✓ 已取得位置";


          resolve();

        },


        error => {

          reject(error);

        },


        {
          enableHighAccuracy: false,

          timeout: 12000,

          maximumAge: 300000
        }

      );

    }
  );

}


/* ========================================
   距離計算
======================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* ========================================
   步行時間估算
======================================== */

function walkingMinutes(meters) {

  /*
    約每分鐘 75 公尺
  */

  return Math.max(
    1,
    Math.round(meters / 75)
  );

}


/* ========================================
   價格估算
======================================== */

function estimatePrice(restaurant) {

  const text = (

    restaurant.name +
    " " +
    restaurant.cuisine

  ).toLowerCase();


  for (
    const rule of priceRules
  ) {

    if (
      rule.keywords.some(
        keyword =>
          text.includes(
            keyword.toLowerCase()
          )
      )
    ) {

      return {
        min: rule.min,
        max: rule.max
      };

    }

  }


  /*
    找不到類型時，
    使用一般餐廳預估。
  */

  return {
    min: 120,
    max: 400
  };

}


/* ========================================
   餐廳分類
======================================== */

function readableCuisine(
  cuisine,
  name
) {

  const text =
    (
      cuisine +
      " " +
      name
    ).toLowerCase();


  if (
    text.includes("mcdonald")
    ||
    text.includes("麥當勞")
  )
    return "麥當勞";


  if (
    text.includes("kfc")
    ||
    text.includes("肯德基")
  )
    return "肯德基";


  if (
    text.includes("mos burger")
    ||
    text.includes("摩斯")
  )
    return "摩斯漢堡";


  if (
    text.includes("burger king")
    ||
    text.includes("漢堡王")
  )
    return "漢堡王";


  if (
    text.includes("subway")
  )
    return "SUBWAY";


  if (
    text.includes("ramen")
    ||
    text.includes("拉麵")
  )
    return "拉麵";


  if (
    text.includes("sushi")
    ||
    text.includes("壽司")
  )
    return "壽司";


  if (
    text.includes("hot_pot")
    ||
    text.includes("hotpot")
    ||
    text.includes("火鍋")
  )
    return "火鍋";


  if (
    text.includes("steak")
    ||
    text.includes("牛排")
  )
    return "牛排";


  if (
    text.includes("bbq")
    ||
    text.includes("燒肉")
  )
    return "燒肉";


  if (
    text.includes("italian")
    ||
    text.includes("pasta")
    ||
    text.includes("義大利")
  )
    return "義大利料理";


  if (
    text.includes("korean")
    ||
    text.includes("韓式")
  )
    return "韓式料理";


  if (
    text.includes("japanese")
    ||
    text.includes("日式")
  )
    return "日式料理";


  if (
    text.includes("chinese")
  )
    return "中式料理";


  if (
    text.includes("burger")
  )
    return "漢堡";


  if (
    text.includes("noodle")
    ||
    text.includes("麵")
  )
    return "麵食";


  if (
    text.includes("breakfast")
    ||
    text.includes("早餐")
  )
    return "早餐";


  if (
    cuisine
  ) {

    return cuisine
      .replaceAll("_"," ")
      .replaceAll(";"," · ");

  }


  return "餐廳";

}


/* ========================================
   Overpass 查詢
======================================== */

function createQuery() {

  return `

[out:json][timeout:18];

(

node
  ["amenity"="restaurant"]
  (around:${SEARCH_RADIUS},${userLat},${userLon});

way
  ["amenity"="restaurant"]
  (around:${SEARCH_RADIUS},${userLat},${userLon});

node
  ["amenity"="fast_food"]
  (around:${SEARCH_RADIUS},${userLat},${userLon});

way
  ["amenity"="fast_food"]
  (around:${SEARCH_RADIUS},${userLat},${userLon});

node
  ["amenity"="food_court"]
  (around:${SEARCH_RADIUS},${userLat},${userLon});

way
  ["amenity"="food_court"]
  (around:${SEARCH_RADIUS},${userLat},${userLon});

);

out center tags;

`;

}


/* ========================================
   單一伺服器請求
======================================== */

async function fetchServer(
  server
) {

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () =>
        controller.abort(),
      10000
    );


  try {

    const response =
      await fetch(
        server,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },

          body:
            "data=" +
            encodeURIComponent(
              createQuery()
            ),

          signal:
            controller.signal

        }
      );


    if (!response.ok) {

      throw new Error(
        "伺服器暫時忙碌"
      );

    }


    const data =
      await response.json();


    return data;


  }

  finally {

    clearTimeout(timer);

  }

}


/* ========================================
   多伺服器備援
======================================== */

async function fetchRestaurants() {

  let lastError = null;


  for (
    let i = 0;
    i < OVERPASS_SERVERS.length;
    i++
  ) {

    const server =
      OVERPASS_SERVERS[i];


    setStatus(
      `正在搜尋附近餐廳…<br>
       資料來源 ${i + 1}/${OVERPASS_SERVERS.length}`
    );


    try {

      const data =
        await fetchServer(server);


      if (
        data &&
        Array.isArray(data.elements)
      ) {

        const parsed =
          parseRestaurants(
            data.elements
          );


        if (
          parsed.length > 0
        ) {

          return parsed;

        }

      }

    }

    catch(error) {

      lastError = error;

    }

  }


  throw (
    lastError ||
    new Error(
      "目前無法取得餐廳資料"
    )
  );

}


/* ========================================
   解析 OSM
======================================== */

function parseRestaurants(
  elements
) {

  const result = [];

  const seen =
    new Set();


  for (
    const item of elements
  ) {

    const tags =
      item.tags || {};


    /*
      沒名字的店先不顯示
    */

    const name =
      tags.name ||
      tags["name:zh"] ||
      tags["name:zh-Hant"];


    if (!name)
      continue;


    const lat =
      item.lat ??
      item.center?.lat;


    const lon =
      item.lon ??
      item.center?.lon;


    if (
      typeof lat !== "number"
      ||
      typeof lon !== "number"
    )
      continue;


    const id =
      item.type +
      "-" +
      item.id;


    if (
      seen.has(id)
    )
      continue;


    seen.add(id);


    const meters =
      distanceMeters(
        userLat,
        userLon,
        lat,
        lon
      );


    const restaurant = {

      id,

      name,

      lat,

      lon,

      distance:
        Math.round(meters),

      cuisine:
        tags.cuisine || "",

      amenity:
        tags.amenity || "",

      brand:
        tags.brand || "",

      openingHours:
        tags.opening_hours || ""

    };


    restaurant.type =
      readableCuisine(
        restaurant.cuisine,
        restaurant.name +
        " " +
        restaurant.brand
      );


    restaurant.price =
      estimatePrice(
        restaurant
      );


    result.push(
      restaurant
    );

  }


  /*
    近的店排前面
  */

  result.sort(
    (a,b) =>
      a.distance -
      b.distance
  );


  return result;

}


/* ========================================
   快取
======================================== */

function saveCache(
  data
) {

  try {

    const cache = {

      time:
        Date.now(),

      lat:
        userLat,

      lon:
        userLon,

      restaurants:
        data

    };


    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(cache)
    );

  }

  catch(error) {

    /*
      快取失敗不影響使用
    */

  }

}


/* ========================================
   讀取快取
======================================== */

function loadCache() {

  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!raw)
      return null;


    const cache =
      JSON.parse(raw);


    /*
      超過六小時就重新抓
    */

    if (
      Date.now() -
      cache.time >
      CACHE_TIME
    ) {

      return null;

    }


    /*
      使用者如果已移動太遠，
      不使用舊資料
    */

    const moved =
      distanceMeters(
        userLat,
        userLon,
        cache.lat,
        cache.lon
      );


    if (
      moved > 1000
    ) {

      return null;

    }


    if (
      !Array.isArray(
        cache.restaurants
      )
    )
      return null;


    return cache.restaurants;

  }

  catch(error) {

    return null;

  }

}


/* ========================================
   預算篩選
======================================== */

function applyBudget() {

  const budget =
    document
      .getElementById(
        "budget"
      )
      .value;


  if (
    budget === "all"
  ) {

    filteredRestaurants =
      [...restaurants];

    return;

  }


  if (
    budget === "200"
  ) {

    filteredRestaurants =
      restaurants.filter(
        restaurant =>
          restaurant.price.min <= 200
      );

  }


  else if (
    budget === "400"
  ) {

    filteredRestaurants =
      restaurants.filter(
        restaurant =>
          restaurant.price.max >= 200
          &&
          restaurant.price.min <= 400
      );

  }


  else if (
    budget === "700"
  ) {

    filteredRestaurants =
      restaurants.filter(
        restaurant =>
          restaurant.price.max >= 400
          &&
          restaurant.price.min <= 700
      );

  }


  else if (
    budget === "high"
  ) {

    filteredRestaurants =
      restaurants.filter(
        restaurant =>
          restaurant.price.max >= 700
      );

  }


  /*
    如果預算條件完全沒有結果，
    不讓 App 壞掉。
  */

  if (
    filteredRestaurants.length === 0
  ) {

    filteredRestaurants =
      [...restaurants];

    setStatus(
      "附近沒有足夠符合這個預算的資料，先從附近餐廳幫你挑。"
    );

  }

}


/* ========================================
   優先 5～10 分鐘
======================================== */

function preferredRestaurants() {

  /*
    約 300～800 公尺
  */

  let preferred =
    filteredRestaurants.filter(
      restaurant =>
        restaurant.distance >= 250
        &&
        restaurant.distance <= 800
    );


  /*
    如果 5～10 分鐘內太少，
    就使用全部附近店家。
  */

  if (
    preferred.length < 3
  ) {

    preferred =
      [...filteredRestaurants];

  }


  return preferred;

}


/* ========================================
   抽一家
======================================== */

function pickRestaurant() {

  const pool =
    preferredRestaurants();


  if (
    pool.length === 0
  ) {

    setStatus(
      "附近暫時找不到可以推薦的餐廳。"
    );

    return;

  }


  /*
    先排除最近抽過的店
  */

  let available =
    pool.filter(
      restaurant =>
        !recentIds.includes(
          restaurant.id
        )
    );


  /*
    全部抽過就重新開始
  */

  if (
    available.length === 0
  ) {

    recentIds = [];

    available =
      [...pool];

  }


  const index =
    Math.floor(
      Math.random() *
      available.length
    );


  currentRestaurant =
    available[index];


  recentIds.push(
    currentRestaurant.id
  );


  /*
    最多記住最近 8 家
  */

  if (
    recentIds.length > 8
  ) {

    recentIds.shift();

  }


  showRestaurant(
    currentRestaurant
  );

}


/* ========================================
   顯示結果
======================================== */

function showRestaurant(
  restaurant
) {

  document
    .getElementById(
      "emoji"
    )
    .textContent =
      foodEmoji(
        restaurant.type
      );


  document
    .getElementById(
      "restaurantName"
    )
    .textContent =
      restaurant.name;


  document
    .getElementById(
      "restaurantType"
    )
    .textContent =
      restaurant.type;


  const minutes =
    walkingMinutes(
      restaurant.distance
    );


  document
    .getElementById(
      "distance"
    )
    .innerHTML =
      `約 ${minutes} 分鐘<br>
       ${restaurant.distance} 公尺`;


  document
    .getElementById(
      "price"
    )
    .innerHTML =
      `約 NT$${restaurant.price.min}
       ～${restaurant.price.max}<br>
       / 人`;


  document
    .getElementById(
      "resultCard"
    )
    .classList.add(
      "show"
    );


  setStatus(
    `附近找到 ${restaurants.length} 家，
     幫你挑了這家 👇`
  );

}


/* ========================================
   Emoji
======================================== */

function foodEmoji(type) {

  if (
    type.includes("麵")
  )
    return "🍜";


  if (
    type.includes("壽司")
    ||
    type.includes("日式")
  )
    return "🍣";


  if (
    type.includes("火鍋")
  )
    return "🍲";


  if (
    type.includes("牛排")
  )
    return "🥩";


  if (
    type.includes("燒肉")
  )
    return "🥓";


  if (
    type.includes("漢堡")
    ||
    type.includes("麥當勞")
    ||
    type.includes("肯德基")
    ||
    type.includes("摩斯")
    ||
    type.includes("SUBWAY")
  )
    return "🍔";


  if (
    type.includes("義大利")
  )
    return "🍝";


  if (
    type.includes("韓式")
  )
    return "🥘";


  return "🍽️";

}


/* ========================================
   主搜尋
======================================== */

async function startSearch() {

  const button =
    document.getElementById(
      "findButton"
    );


  button.disabled = true;

  button.textContent =
    "正在找附近好吃的…";


  document
    .getElementById(
      "resultCard"
    )
    .classList.remove(
      "show"
    );


  setStatus(
    "📍 正在確認你的位置…"
  );


  try {

    /*
      1. 定位
    */

    await getLocation();


    /*
      2. 看手機裡有沒有近期資料
    */

    const cached =
      loadCache();


    if (
      cached &&
      cached.length > 0
    ) {

      restaurants =
        cached;


      applyBudget();

      pickRestaurant();


      setStatus(
        `⚡ 使用附近已儲存的 ${restaurants.length} 家餐廳資料`
      );


      return;

    }


    /*
      3. 沒快取才連線搜尋
    */

    restaurants =
      await fetchRestaurants();


    /*
      4. 存手機
    */

    saveCache(
      restaurants
    );


    /*
      5. 預算
    */

    applyBudget();


    /*
      6. 抽一家
    */

    pickRestaurant();

  }

  catch(error) {

    console.error(error);


    document
      .getElementById(
        "emoji"
      )
      .textContent =
        "😵‍💫";


    setStatus(
      "⚠️ 這次沒有成功取得附近餐廳。<br>" +
      "不用重新整理頁面，等幾秒再按一次就可以。"
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "🍽️ 幫我找吃的";

  }

}


/* ========================================
   換一家

   注意：
   不會重新連 API
======================================== */

function chooseAnother() {

  if (
    restaurants.length === 0
  ) {

    startSearch();

    return;

  }


  applyBudget();

  pickRestaurant();

}


/* ========================================
   Google Maps 導航
======================================== */

function openMap() {

  if (
    !currentRestaurant
  )
    return;


  const destination =
    encodeURIComponent(
      currentRestaurant.lat +
      "," +
      currentRestaurant.lon
    );


  const url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    destination +
    "&travelmode=walking";


  window.open(
    url,
    "_blank"
  );

}


/* ========================================
   狀態文字
======================================== */

function setStatus(text) {

  document
    .getElementById(
      "status"
    )
    .innerHTML =
      text;

}


/* ========================================
   預算改變

   已有資料就立即重抽
======================================== */

document
  .getElementById(
    "budget"
  )
  .addEventListener(
    "change",
    () => {

      if (
        restaurants.length > 0
      ) {

        recentIds = [];

        applyBudget();

        pickRestaurant();

      }

    }
  );

</script>
