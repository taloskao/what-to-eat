let userLat = null;

let userLon = null;

/* =====================================================
   取得 GPS
===================================================== */

function getLocation() {

  const status =
    document.getElementById(
      "status"
    );

  const button =
    document.getElementById(
      "locationButton"
    );


  if (!navigator.geolocation) {

    status.textContent =
      "這台裝置不支援定位。";

    return;
  }


  status.textContent =
    "正在取得你的位置…";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLat =
        position.coords.latitude;

      userLon =
        position.coords.longitude;


      button.textContent =
        "✓ 已取得位置";

      button.classList.add(
        "ready"
      );


      status.textContent =
        "定位完成，按「幫我找吃的」開始搜尋。";

    },


    function(error) {

      console.log(
        "定位錯誤：",
        error
      );


      if (
        error.code ===
        error.PERMISSION_DENIED
      ) {

        status.textContent =
          "定位權限被關閉，請允許這個網站使用位置。";

      }

      else {

        status.textContent =
          "目前無法取得位置，請再試一次。";

      }

    },


    {

      enableHighAccuracy: true,

      timeout: 12000,

      maximumAge: 60000

    }

  );

}



/* =====================================================
   計算直線距離
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (lat2 - lat1) *
    Math.PI /
    180;


  const dl =
    (lon2 - lon1) *
    Math.PI /
    180;


  const a =

    Math.sin(
      dp / 2
    ) ** 2

    +

    Math.cos(p1) *

    Math.cos(p2) *

    Math.sin(
      dl / 2
    ) ** 2;


  return Math.round(

    2 *

    R *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    )

  );

}



/* =====================================================
   Overpass 免費地圖服務

   重要：
   每一台最多等待 8 秒。

   沒反應就自動換下一台。

   所以不會再無限卡住。
===================================================== */

async function overpassQuery(
  query
) {

  const servers = [

    "https://overpass-api.de/api/interpreter",

    "https://overpass.kumi.systems/api/interpreter",

    "https://overpass.nchc.org.tw/api/interpreter"

  ];


  for (
    const server
    of servers
  ) {

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        function() {

          controller.abort();

        },

        8000
      );


    try {

      const response =
        await fetch(

          server,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"

            },

            body:

              "data=" +

              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }

        );


      clearTimeout(
        timer
      );


      if (
        !response.ok
      ) {

        console.log(
          "伺服器錯誤：",
          server,
          response.status
        );

        continue;

      }


      const data =
        await response.json();


      if (
        data &&
        data.elements
      ) {

        return data;

      }

    }


    catch(error) {

      clearTimeout(
        timer
      );


      console.log(

        "Overpass 失敗：",

        server,

        error

      );

    }

  }


  throw new Error(
    "附近餐廳搜尋服務目前沒有回應"
  );

}



/* =====================================================
   開始找附近餐廳
===================================================== */

async function startSearch() {

  if (searching) {

    return;

  }


  if (
    userLat === null ||
    userLon === null
  ) {

    getLocation();


    document.getElementById(
      "status"
    ).textContent =

      "正在取得位置，完成後再按一次「幫我找吃的」。";


    return;

  }


  searching = true;


  const button =
    document.getElementById(
      "findButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  button.disabled = true;


  button.textContent =
    "⏳ 正在找附近好吃的…";


  status.textContent =
    "正在搜尋附近餐廳，最多可能需要約 20 秒";


  document.getElementById(
    "results"
  ).classList.remove(
    "show"
  );


  document.getElementById(
    "choice"
  ).classList.remove(
    "show"
  );


  document.getElementById(
    "drink"
  ).classList.remove(
    "show"
  );


  try {


    const query = `

      [out:json][timeout:12];

      (

        node["amenity"="restaurant"]
        (around:1000,${userLat},${userLon});

        way["amenity"="restaurant"]
        (around:1000,${userLat},${userLon});

        node["amenity"="fast_food"]
        (around:1000,${userLat},${userLon});

        way["amenity"="fast_food"]
        (around:1000,${userLat},${userLon});

        node["amenity"="food_court"]
        (around:1000,${userLat},${userLon});

      );

      out center tags;

    `;


    const data =
      await overpassQuery(
        query
      );


    const found = [];

    const names =
      new Set();


    for (
      const place
      of data.elements || []
    ) {


      const tags =
        place.tags || {};


      const name =

        tags["name:zh-Hant"]

        ||

        tags["name:zh"]

        ||

        tags.name;


      if (!name) {

        continue;

      }


      const lat =

        place.lat

        ??

        place.center?.lat;


      const lon =

        place.lon

        ??

        place.center?.lon;


      if (
        lat == null ||
        lon == null
      ) {

        continue;

      }


      const distance =
        distanceMeters(

          userLat,

          userLon,

          lat,

          lon

        );


      /*
         約 5～10 分鐘步行區域。

         目前先用直線距離估算。

         250～850 公尺。
      */

      if (
        distance < 250 ||
        distance > 850
      ) {

        continue;

      }


      const uniqueName =
        name
          .trim()
          .toLowerCase();


      if (
        names.has(
          uniqueName
        )
      ) {

        continue;

      }


      names.add(
        uniqueName
      );


      found.push({

        name: name,

        lat: lat,

        lon: lon,

        distance: distance,

        cuisine:
          tags.cuisine || "",

        brand:
          tags.brand || "",

        opening:
          tags.opening_hours || ""

      });

    }


    if (
      found.length === 0
    ) {

      throw new Error(
        "附近沒有找到足夠的餐廳資料"
      );

    }


    /*
       每次重新洗牌
    */

    found.sort(
      function() {

        return (
          Math.random() -
          0.5
        );

      }
    );


    /*
       最多顯示 5 家
    */

    currentRestaurants =
      found.slice(
        0,
        5
      );


    renderRestaurants();


    status.textContent =

      "找到 " +

      found.length +

      " 間附近餐廳，先挑了 " +

      currentRestaurants.length +

      " 間給你。";


    document.getElementById(
      "results"
    ).classList.add(
      "show"
    );


    /*
       搜尋完成後
       自動往結果滑
    */

    setTimeout(
      function() {

        document.getElementById(
          "results"
        ).scrollIntoView({

          behavior:
            "smooth",

          block:
            "start"

        });

      },

      200
    );

  }


  catch(error) {


    console.log(
      error
    );


    status.textContent =

      "⚠️ 這次沒有成功取得附近餐廳。請按一次再試試看。";

  }


  finally {


    searching = false;


    button.disabled =
      false;


    button.textContent =
      "🍽️ 幫我找吃的";

  }

}



/* =====================================================
   判斷餐廳料理類型
===================================================== */

function detectFoodType(
  restaurant
) {


  const text = (

    restaurant.name +

    " " +

    restaurant.cuisine +

    " " +

    restaurant.brand

  ).toLowerCase();


  for (
    const type
    of FOOD_TYPES
  ) {


    const emoji =
      type[0];


    const title =
      type[1];


    const keywords =
      type[2];


    for (
      const keyword
      of keywords
    ) {


      if (

        text.includes(

          keyword.toLowerCase()

        )

      ) {


        return {

          emoji:
            emoji,

          title:
            title

        };

      }

    }

  }


  return {

    emoji:
      "🍴",

    title:
      "餐廳"

  };

}



/* =====================================================
   顯示餐廳
===================================================== */

function renderRestaurants() {


  const cards =
    document.getElementById(
      "cards"
    );


  cards.innerHTML =
    "";


  currentRestaurants.forEach(

    function(
      restaurant
    ) {


      const type =
        detectFoodType(
          restaurant
        );


      /*
         約 75 公尺 / 分鐘
         作為簡單估算
      */

      const walking =

        Math.max(

          4,

          Math.round(

            restaurant.distance /

            75

          )

        );


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      card.innerHTML = `

        <div class="card-top">

          <div>

            <div class="restaurant">

              ${escapeHTML(
                restaurant.name
              )}

            </div>


            <div class="meta">

              🚶 約 ${walking} 分鐘

              ·

              ${restaurant.distance} 公尺

            </div>

          </div>


          <div class="tag">

            ${type.emoji}

            ${type.title}

          </div>

        </div>


        <a

          class="navigate"

          href="${appleMapsURL(
            restaurant
          )}"

          target="_blank"

          rel="noopener"

        >

          🧭 看地圖

        </a>

      `;


      cards.appendChild(
        card
      );

    }

  );

}



/* =====================================================
   不想選 → 直接幫我決定
===================================================== */

function decideRestaurant() {


  if (
    !currentRestaurants.length
  ) {

    return;

  }


  selectedRestaurant =

    currentRestaurants[

      Math.floor(

        Math.random() *

        currentRestaurants.length

      )

    ];


  const type =
    detectFoodType(
      selectedRestaurant
    );


  document.getElementById(
    "emoji"
  ).textContent =
    type.emoji;


  const walking =

    Math.max(

      4,

      Math.round(

        selectedRestaurant.distance /

        75

      )

    );


  const choice =
    document.getElementById(
      "choice"
    );


  choice.innerHTML = `

    <div class="choice-label">

      🎯 不要再選了，今天就吃

    </div>


    <div class="choice-name">

      ${escapeHTML(
        selectedRestaurant.name
      )}

    </div>


    <div class="meta">

      ${type.emoji}

      ${type.title}

      ·

      🚶 約 ${walking} 分鐘

    </div>


    <a

      class="navigate"

      href="${appleMapsURL(
        selectedRestaurant
      )}"

      target="_blank"

      rel="noopener"

    >

      🧭 帶我去吃

    </a>

  `;


  choice.classList.add(
    "show"
  );


  /*
     找這間餐廳附近的飲料
  */

  findDrink(

    selectedRestaurant.lat,

    selectedRestaurant.lon

  );



  setTimeout(

    function() {

      choice.scrollIntoView({

        behavior:
          "smooth",

        block:
          "center"

      });

    },

    150

  );

}



/* =====================================================
   找餐廳附近飲料店
===================================================== */

async function findDrink(
  lat,
  lon
) {


  const drink =
    document.getElementById(
      "drink"
    );


  drink.classList.add(
    "show"
  );


  drink.innerHTML =

    "🧋 正在找餐廳附近的飲料…";


  try {


    const query = `

      [out:json][timeout:10];

      (

        node["shop"="beverages"]
        (around:500,${lat},${lon});

        way["shop"="beverages"]
        (around:500,${lat},${lon});

        node["amenity"="cafe"]
        (around:500,${lat},${lon});

        node["cuisine"="bubble_tea"]
        (around:500,${lat},${lon});

      );

      out center tags;

    `;


    const data =
      await overpassQuery(
        query
      );


    const drinks =
      [];


    const usedNames =
      new Set();


    for (
      const place
      of data.elements || []
    ) {


      const tags =
        place.tags || {};


      const name =

        tags["name:zh-Hant"]

        ||

        tags["name:zh"]

        ||

        tags.name;


      if (!name) {

        continue;

      }


      const dLat =

        place.lat

        ??

        place.center?.lat;


      const dLon =

        place.lon

        ??

        place.center?.lon;


      if (
        dLat == null ||
        dLon == null
      ) {

        continue;

      }


      const key =
        name
          .trim()
          .toLowerCase();


      if (
        usedNames.has(
          key
        )
      ) {

        continue;

      }


      usedNames.add(
        key
      );


      drinks.push({

        name:
          name,

        lat:
          dLat,

        lon:
          dLon,

        distance:

          distanceMeters(

            lat,

            lon,

            dLat,

            dLon

          )

      });

    }


    drinks.sort(

      function(a,b) {

        return (
          a.distance -
          b.distance
        );

      }

    );


    if (
      drinks.length === 0
    ) {

      throw new Error(
        "沒有飲料資料"
      );

    }


    const pick =
      drinks[0];


    drink.innerHTML = `

      <div class="drink-label">

        🧋 吃完順便喝這間

      </div>


      <div class="drink-name">

        ${escapeHTML(
          pick.name
        )}

      </div>


      <div class="meta">

        從餐廳約

        ${pick.distance}

        公尺

      </div>


      <a

        class="navigate"

        href="${appleMapsURL(
          pick
        )}"

        target="_blank"

        rel="noopener"

      >

        🧭 飲料店導航

      </a>

    `;

  }


  catch(error) {


    console.log(
      "飲料搜尋失敗",
      error
    );


    drink.innerHTML = `

      <div class="drink-label">

        🧋 餐後飲料

      </div>


      <div class="meta">

        這附近目前沒有找到足夠的
        免費地圖飲料店資料。

      </div>

    `;

  }

}



/* =====================================================
   Apple Maps 步行導航
===================================================== */

function appleMapsURL(
  place
) {


  return (

    "https://maps.apple.com/?" +

    "daddr=" +

    place.lat +

    "," +

    place.lon +

    "&q=" +

    encodeURIComponent(
      place.name
    ) +

    "&dirflg=w"

  );

}



/* =====================================================
   防止店家名稱破壞 HTML
===================================================== */

function escapeHTML(
  text
) {


  return String(
    text
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}
